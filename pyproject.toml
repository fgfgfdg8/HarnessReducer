[project]
name = "harnessreducer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tree-sitter>=0.25.2",
    "tree-sitter-cpp>=0.23.4",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
]

[project.scripts]
harnessreducer = "harnessreducer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harnessreducer"]
